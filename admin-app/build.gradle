plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.meysam.divanadmin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.meysam.divanadmin'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    sourceSets.main.assets.srcDirs += '../app/src/main/assets/fonts'
    signingConfigs {
        release {
            if (System.getenv('DIVAN_KEYSTORE_FILE')) {
                storeFile file(System.getenv('DIVAN_KEYSTORE_FILE'))
                storePassword System.getenv('DIVAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DIVAN_KEY_ALIAS')
                keyPassword System.getenv('DIVAN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig System.getenv('DIVAN_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main.java.srcDirs += ['../push-runtime/src/main/java']
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.2' }
