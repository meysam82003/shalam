plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.meysam.divanadmin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.meysam.divanadmin'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets.main.assets.srcDirs += ['../app/src/main/assets/fonts', '../server/public/assets/calendar']
    signingConfigs {
        release {
            if (System.getenv('DIVAN_KEYSTORE_FILE')) {
                storeFile file(System.getenv('DIVAN_KEYSTORE_FILE'))
                storePassword System.getenv('DIVAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DIVAN_KEY_ALIAS')
                keyPassword System.getenv('DIVAN_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig System.getenv('DIVAN_KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main.java.srcDirs += ['../push-runtime/src/main/java']
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
