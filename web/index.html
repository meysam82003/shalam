      let body = `<div class="panel raised banner" id="result-banner">${trophySvg()}<h2>${esc(winnerText)}</h2><p class="cap">${esc(resultReason(s, totals))}</p></div>`;
      if (g.isTeamGame) {
        body += `<div class="duo">${s.sides.map((x, i) => sideCard(x, sg(totals[i]), sc(totals[i]), "کارنامه ›", winners.length === 1 && winners[0] === i, null, "result-side-" + i, () => openProfile(x.name, true))).join("")}</div>`;
      } else {
        const st = s.game === "dolo" ? DoloEngine.state(s) : null;
        body += `<div class="stack tight">${GameEngine.ranking(s).map((i, place) => rankRow(s, place, i, totals[i], place === 0 && winners.length > 0, st && st.eliminatedAt.has(i) ? "حذف‌شده" : "", false, () => openProfile(s.sides[i].name, false))).join("")}</div>`;
      }
      body += `<div class="panel flat">${kvRows([
        ["تعداد دست‌ها", n(GameEngine.playedHands(s))], ["مدت بازی", dur(s.elapsedMs)], ["شروع", jdate(s.id)], ["پایان", s.endedAt ? jdate(s.endedAt) : "—"]
      ])}</div>`;
      body += `<div class="grid g2">${btn("اشتراک تصویر", () => shareGame(s), { kind: "secondary", icon: "share", id: "result-share" })}${s.game === "shalam" ? btn("آمار کامل بازی", () => shalamStatsDialog(s), { kind: "ghost", icon: "chart", id: "result-stats" }) : btn("رنک‌بندی", () => push(RankingsScreen()), { kind: "ghost", icon: "rank", id: "result-rankings" })}</div>`;
      body += section("نمودار بازی", "chart") + `<div class="panel flat" id="result-chart">${gameChart(s)}</div>`;
      body += section("دست‌ها", "history");
      body += s.rounds.length ? s.rounds.map((_, i) => roundCard(s, i, null, false)).join("") : emptyState("history", "دستی ثبت نشده", "این بازی بدون دست به پایان رسیده است.");
      const reopen = () => { s.finished = false; s.endedAt = null; commit(s); replace(boardFor(sid)); };
      const rematch = () => {
        const id = repo.newSessionId();
        const fresh = mkSession(id, s.game, s.sides, [], clone(s.rules), { updatedAt: id, label: s.label });
        live.set(id, fresh);
        resetTo(HomeScreen(), boardFor(id));
      };
      let bottom = s.leagueId && repo.league(s.leagueId)
        ? btn("بازگشت به لیگ", () => resetTo(HomeScreen(), LeaguesScreen(), LeagueScreen(s.leagueId)), { kind: "primary", icon: "league", cls: "block", id: "result-league" })
        : btn("بازی دوباره با همین ترکیب", rematch, { kind: "primary", icon: "play", cls: "block", id: "result-rematch" });
      bottom += `<div class="row"><div class="grow">${btn("ادامهٔ بازی", reopen, { kind: "secondary", icon: "undo", cls: "block sm", id: "result-reopen" })}</div><div class="grow">${btn("خانه", () => resetTo(HomeScreen()), { kind: "secondary", icon: "home", cls: "block sm", id: "result-home" })}</div></div>`;
      return { title: "نتیجهٔ بازی " + g.title, subtitle: sessionSubtitle(s), body, bottom };
    }
  };
}

/* ================= History ================= */
function HistoryScreen() {
  const st = { status: 0, game: null };
  return {
    name: "history",
    view() {
      const all = allSessions();
      const shown = all.filter((s) => (st.game == null || s.game === st.game) && (st.status === 1 ? !s.finished : st.status === 2 ? s.finished : true));
      let body = `<div class="grid g3">${[[0, "همه"], [1, "در جریان"], [2, "پایان‌یافته"]].map(([v, l]) => chip(l, st.status === v, () => { st.status = v; refresh(); }, { id: "hist-status-" + v })).join("")}</div>`;
      body += `<div class="chips">${chip("همهٔ بازی‌ها", st.game == null, () => { st.game = null; refresh(); }, { gold: true, id: "hist-game-all" })}${GAME_LIST.map((g) => chip(g.title, st.game === g.key, () => { st.game = g.key; refresh(); }, { gold: true, id: "hist-game-" + g.key })).join("")}</div>`;
      if (!shown.length) body += emptyState("history", "بازی‌ای پیدا نشد", "پس از ثبت اولین دست، بازی اینجا ذخیره می‌شود.");
      body += shown.map((s) => {
        const totals = GameEngine.totals(s);
        const hidden = s.game === "menfi" && s.rules.menfi.hidden && !s.finished;
        const winners = s.finished ? GameEngine.winners(s) : [];
        const order = gameOf(s.game).isTeamGame ? s.sides.map((_, i) => i) : GameEngine.ranking(s);
        const listed = order.slice(0, 4);
        return `<div class="panel tap stack tight" role="button" tabindex="0" id="hist-${s.id}" aria-label="باز کردن بازی ${esc(gameOf(s.game).title)}" data-a="${on(() => openSession(s))}"><div class="row">${seal(s.game, 40)}<div class="grow"><div class="row" style="gap:6px;flex-wrap:wrap"><b class="goldt">${esc(gameOf(s.game).title)}</b>${s.finished ? badge("پایان‌یافته", "gold") : badge("در جریان", "solid")}${s.leagueId ? badge("لیگ", "turq") : ""}</div><span class="cap">${jdate(s.updatedAt)}</span></div>${ibtn("trash", "حذف بازی", () => confirmBox("حذف بازی", "این بازی برای همیشه از تاریخچه حذف شود؟", "حذف", true, () => { repo.delete(s.id); live.delete(s.id); if (s.leagueId) leagueSync(s.leagueId); refresh(); }), { size: "xs", id: "hist-del-" + s.id })}</div>${listed.map((i) => `<div class="row" style="gap:8px">${emblem(s.sides[i].avatar, 24)}<span class="grow${winners.includes(i) ? " goldt" : ""}" style="font-weight:700;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.sides[i].name)}${winners.includes(i) ? " ♛" : ""}</span><b class="num ${hidden ? "dimt" : sc(totals[i])}">${hidden ? "•••" : sg(totals[i])}</b></div>`).join("")}${order.length > listed.length ? `<span class="cap">و ${n(order.length - listed.length)} بازیکن دیگر</span>` : ""}<span class="cap dimt">${n(GameEngine.playedHands(s))} دست  •  ${dur(s.elapsedMs)}  •  ${esc(sessionSubtitle(s))}</span></div>`;
      }).join("");
      if (all.length) body += btn("پاک‌کردن کل تاریخچه", () => confirmBox("پاک‌کردن تاریخچه", "تمام بازی‌های ذخیره‌شده برای همیشه حذف شوند؟", "حذف همه", true, () => { repo.clearHistory(); live.clear(); refresh(); }), { kind: "danger", icon: "trash", id: "hist-clear" });
      return { title: "تاریخچهٔ بازی‌ها", subtitle: n(all.length) + " بازی ذخیره‌شده", body };
    }
  };
}

/* ================= Players & teams ================= */
function PlayersScreen() {
  const st = { teams: true };
  function edit(entry) {
    const teams = st.teams;
    const m = { name: entry ? entry.name : "", avatar: entry ? entry.avatar : 0, err: "" };
    openModal({
      title: entry ? "ویرایش" : teams ? "تیم تازه" : "بازیکن تازه",
      body: () => `<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><button type="button" class="avb" id="roster-av" aria-label="تغییر نشان" data-a="${on(() => avatarPicker(m.avatar, (p) => { m.avatar = p; refreshModal(); }))}">${emblem(m.avatar, 72)}</button><span class="cap">برای تغییر نشان لمس کنید</span></div>${field("roster-name", m.name, { ph: teams ? "نام تیم" : "نام بازیکن", label: "نام", onInput: (t) => { m.name = t; } })}<p class="err" id="roster-err">${esc(m.err)}</p>`,
      actions: [
        { label: "ذخیره", kind: "primary", keep: true, id: "roster-save", fn: () => {
          const value = m.name.trim();
          const roster = repo.roster();
          const errEl = () => document.getElementById("roster-err");
          if (!value) { m.err = "نام را وارد کنید"; if (errEl()) errEl().textContent = m.err; return; }
          if (roster.some((e) => e.name === value && e.isTeam === teams && (!entry || e.id !== entry.id))) { m.err = "این نام قبلاً ثبت شده است"; if (errEl()) errEl().textContent = m.err; return; }
          closeModal();
          if (entry) { const k = roster.findIndex((e) => e.id === entry.id); if (k >= 0) roster[k] = Object.assign({}, roster[k], { name: value, avatar: m.avatar }); }
          else roster.push({ id: Date.now(), name: value, avatar: m.avatar, isTeam: teams });
          repo.saveRoster(roster);
          refresh();
        } },
        { label: "انصراف" }
      ]
    });
  }
  return {
    name: "players",
    view() {
      const roster = repo.roster();
      const sessions = allSessions();
      const shown = roster.filter((e) => e.isTeam === st.teams);
      let body = `<div class="grid g2">${chip("تیم‌ها (شلم و منفی)", st.teams, () => { st.teams = true; refresh(); }, { gold: true, id: "roster-tab-teams" })}${chip("بازیکنان (هزارتایی و دو لو)", !st.teams, () => { st.teams = false; refresh(); }, { gold: true, id: "roster-tab-players" })}</div>`;
      if (!shown.length) body += emptyState("players", st.teams ? "هنوز تیمی ثبت نشده" : "هنوز بازیکنی ثبت نشده", "نام‌هایی که در شروع بازی وارد می‌کنید خودکار اینجا ذخیره می‌شوند.");
      body += shown.map((e) => {
        const related = sessions.filter((s) => gameOf(s.game).isTeamGame === e.isTeam && s.sides.some((x) => x.name === e.name));
        const wins = related.filter((s) => s.finished && GameEngine.winners(s).some((i) => s.sides[i].name === e.name)).length;
        return `<div class="panel row" style="padding:10px 12px 12px"><button type="button" class="tap row grow plainbtn" id="roster-profile-${e.id}" aria-label="کارنامهٔ ${esc(e.name)}" data-a="${on(() => openProfile(e.name, e.isTeam))}">${emblem(e.avatar, 48)}<span class="grow" style="min-width:0"><b class="goldt" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.name)}</b><span class="cap">${n(related.length)} بازی  •  ${n(wins)} برد  •  کارنامه ›</span></span></button>${ibtn("edit", "ویرایش " + e.name, () => edit(e), { size: "xs", id: "roster-edit-" + e.id })}${ibtn("trash", "حذف " + e.name, () => confirmBox("حذف از فهرست", `«${e.name}» از فهرست حذف شود؟ بازی‌های ثبت‌شده تغییری نمی‌کنند.`, "حذف", true, () => { repo.saveRoster(repo.roster().filter((x) => x.id !== e.id)); refresh(); }), { size: "xs", id: "roster-del-" + e.id })}</div>`;
      }).join("");
      return {
        title: "بازیکنان و تیم‌ها", subtitle: `${n(roster.filter((e) => e.isTeam).length)} تیم • ${n(roster.filter((e) => !e.isTeam).length)} بازیکن`, body,
        bottom: btn(st.teams ? "افزودن تیم" : "افزودن بازیکن", () => edit(null), { kind: "primary", icon: "plus", cls: "block", id: "roster-add" })
      };
    }
  };
}
/* ================= Rules text (RulesText in ScreenRules.kt, extended) ================= */
const RulesText = {
  doubleName(t) { return t === 1 ? "مثبت" : t === 2 ? "منفی" : t === 3 ? "پرسش در بازی" : "غیرفعال"; },
  shelemName(m) {
    const base = n(m.maxPoints * 2);
    if (m.shelemMode === 1) return base + " امتیاز برای حاکم";
    if (m.shelemMode === 2) return base + " امتیاز منفی برای تیم بازنده";
    if (m.shelemMode === 3) return base + " برای حاکم و امتیاز تیم بازنده";
    return `دلخواه (${sg(m.shelemContractor)} / ${sg(m.shelemOpponent)})`;
  },
  shalamSummary(r) {
    const m = r.mode;
    const out = [
      `هر دست ${n(m.maxPoints)} امتیاز • پایان در ${n(r.endPoint)}` + (m.endWithDiff ? ` یا اختلاف ${n(m.endDiff)}` : ""),
      `دوبل: ${RulesText.doubleName(r.doubleType)} • حد دوبل ${n(m.doubleLimit)}`,
      `شلم: ${RulesText.shelemName(m)} • شلم دوبل: ${m.doubleShelemMode === 1 ? "دو برابر" : sg(m.doubleShelemWin) + " / " + sg(m.doubleShelemLose)}`,
      r.contractOnly ? "حاکم در برد فقط امتیاز تعهد را می‌گیرد" : "حاکم در برد امتیاز واقعی خود را می‌گیرد"
    ];
    if (r.highLimitEnabled) out.push("محدودیت امتیاز بالا از " + n(r.highLimit));
    return out;
  },
  menfiSummary(r) {
    const scoring = r.scoring === MenfiScoring.LEGACY
      ? `عدد ۳: ${sg(r.threeSuccess)} / ${sg(r.threeFailure)} • سایر اعداد: ±(۱۳ − عدد)`
      : `گرفتن: امتیاز مثبت جدول (عدد ۱۰ ← ${sg(MenfiEngine.successScore(10, r))}) • نگرفتن: ${sg(MenfiEngine.failureScore(3, r))} تا ${sg(MenfiEngine.failureScore(13, r))}`;
    return [`${n(r.hands)} دست • اعداد ${n(3)} تا ${n(13)}`, scoring, r.highWins ? "برنده: بیشترین جمع امتیاز" : "برنده: کمترین جمع امتیاز",
      r.tieBreak ? `تساوی پس از آخرین دست: داور دست اضافه تعیین می‌کند (پیش‌فرض ${n(r.tieExtraHands)})` : "تساوی پس از آخرین دست: بازی مساوی تمام می‌شود"];
  },
  shalam(r) {
    const m = r.mode, max = n(m.maxPoints), base = m.maxPoints * 2;
    const e1 = ShalamEngine.scoreHand(135, 35, r), e2 = ShalamEngine.scoreHand(135, 15, r);
    const end = [`بازی چهارنفره و دو تیمی است و ${r.joker ? "با جوکر" : "بدون جوکر"} انجام می‌شود.`,
      `بازی وقتی تمام می‌شود که یک تیم به ${n(r.endPoint)} امتیاز برسد (در شروع هر بازی بین ${n(400)} تا ${n(2800)} قابل انتخاب است).`];
    if (m.endWithDiff) end.push(`اگر اختلاف امتیاز دو تیم به ${n(m.endDiff)} برسد، بازی خودکار پایان می‌یابد.`);
    const dbl = [`اگر تعهد حاکم شکست بخورد و حریف دست‌کم ${n(m.doubleLimit)} امتیاز بگیرد، دست «دوبل» است.`,
      r.doubleType === 1 ? "دوبل مثبت: حاکم منفیِ تعهد می‌گیرد و امتیاز حریف دو برابر ثبت می‌شود."
        : r.doubleType === 2 ? "دوبل منفی: حاکم دو برابرِ تعهد منفی می‌شود و حریف امتیاز خودش را می‌گیرد."
        : r.doubleType === 3 ? "پرسش در بازی: پس از هر دوبل، نوع آن (مثبت یا منفی) را انتخاب می‌کنید." : "دوبل غیرفعال است و شکست، همان منفیِ تعهد است."];
    const collect = m.collectAll === 2 ? "حاکم دو برابرِ تعهد خود را می‌گیرد." : m.collectAll === 3 ? "دست به‌صورت خودکار «شلم» محاسبه می‌شود." : m.collectAll === 4 ? `حاکم ${n(m.collectAllCustom)} امتیاز می‌گیرد.` : `حاکم ${max} امتیاز می‌گیرد.`;
    const shelem = ["شلم یعنی تیم حاکم همهٔ امتیازهای دست را بگیرد؛ اگر حریف حتی یک امتیاز بگیرد، شلم شکست خورده است.",
      m.shelemMode === 1 ? `برد: حاکم ${sg(base)}، حریف صفر. باخت: حاکم ${sg(-base)}.`
        : m.shelemMode === 2 ? `برد: تیم بازنده (حریف) ${sg(-base)}. باخت: حریف ${sg(base)} می‌گیرد.`
        : m.shelemMode === 3 ? `برد: حاکم ${sg(base)}. باخت: حاکم ${sg(-base)} و حریف امتیاز گرفته‌شدهٔ خودش را می‌گیرد.`
        : `برد: حاکم ${sg(m.shelemContractor)} و حریف ${sg(m.shelemOpponent)}. باخت: حاکم ${sg(-m.shelemContractor)} و حریف ${sg(m.shelemOpponent)}.`,
      m.doubleShelemMode === 1 ? "شلم دوبل: همهٔ امتیازهای شلم دو برابر می‌شود." : `شلم دوبل: برد ${sg(m.doubleShelemWin)} و باخت ${sg(m.doubleShelemLose)} برای حاکم.`];
    if (m.maxBidIsShelem) shelem.push(`خواندن ${max} به‌صورت خودکار شلم محاسبه می‌شود.`);
    const out = [
      { title: "هدف و پایان بازی", lines: end },
      { title: "امتیاز هر دست", lines: [`هر دست ${max} امتیاز دارد` + (m.maxPoints === 165 ? ": هر دست‌برد ۵ امتیاز (۱۳ × ۵ = ۶۵)، هر آس و هر ده ۱۰ امتیاز و هر پنج ۵ امتیاز." : "."), "امتیازها همیشه مضرب ۵ هستند."] },
      { title: "تعهد (امتیاز خوانده‌شده)", lines: [`تیم حاکم عددی بین ${n(ShalamEngine.MIN_PICKER_BID)} تا ${max} با گام ۵ می‌خواند؛ با صفحه‌کلید از ${n(ShalamEngine.MIN_TYPED_BID)} نیز مجاز است و عدد کمتر از ۱۰۰ به‌صورت ۱xx خوانده می‌شود (۳۵ ← ۱۳۵).`, "«شلم» و «شلم دوبل» جدا انتخاب می‌شوند. پاس یعنی دست بی‌امتیاز.", "انتخاب خال حکم اختیاری است و در آمار بازی دیده می‌شود."] },
      { title: "محاسبهٔ دست", lines: [`پس از بازی فقط امتیاز تیم حریف وارد می‌شود. امتیاز واقعی حاکم = ${max} منهای امتیاز حریف.`,
        `اگر تعهد + امتیاز حریف از ${max} بیشتر نشود، حاکم ${r.contractOnly ? "فقط امتیاز تعهد" : "امتیاز واقعی خود"} را می‌گیرد و حریف هم امتیاز خودش را.`,
        "در غیر این صورت حاکم منفیِ تعهد می‌گیرد و حریف امتیاز خودش را.",
        `نمونه: تعهد ${n(135)} و حریف ${n(35)} ← حاکم ${sg(e1.contractor)}، حریف ${sg(e1.opponent)}.`,
        `نمونه: تعهد ${n(135)} و حریف ${n(15)} ← حاکم ${sg(e2.contractor)}، حریف ${sg(e2.opponent)}.`] },
      { title: "دوبل", lines: dbl },
      { title: "گرفتن همهٔ امتیازها بدون شلم", lines: ["اگر حاکم بدون خواندن شلم همهٔ امتیازها را بگیرد: " + collect] },
      { title: "شلم", lines: shelem }
    ];
    if (r.highLimitEnabled) out.push({ title: "محدودیت امتیاز بالا", lines: [`تیمی که جمع امتیازش به ${n(r.highLimit)} یا بیشتر رسیده، فقط وقتی امتیاز می‌گیرد که خودش حاکم باشد و ببرد.`, r.loserPointsAboveLimit ? "اگر حاکمِ حریف شکست بخورد، این تیم امتیاز خودش را می‌گیرد." : "حتی با شکست حاکمِ حریف هم امتیازی به این تیم نمی‌رسد."] });
    out.push({ title: "ثبت، ویرایش و حذف", lines: ["هر دست قابل ویرایش و حذف است و جمع‌ها همیشه دوباره محاسبه می‌شوند.", "از منوی بازی می‌توان امتیاز تقلب یا جریمه برای یک تیم ثبت کرد و جمع امتیازها را مستقیم اصلاح کرد.", "بازی پس از هر دست خودکار ذخیره می‌شود و از تاریخچه قابل ادامه است."] });
    return out;
  },
  menfi(r) {
    const ex = (a, b) => MenfiEngine.outcomes(a, b, r).map((o) => `(تیم اول ${sg(o.teamAScore)} و تیم دوم ${sg(o.teamBScore)})`).join("، ");
    const table = `<div class="tablewrap"><table class="tbl" style="min-width:0"><thead><tr><th scope="col">عدد</th><th scope="col">گرفتن</th><th scope="col">نگرفتن</th></tr></thead><tbody>${MenfiScoring.numbers.map((x) => `<tr><td class="goldt">${n(x)}</td><td class="pos">${sg(MenfiEngine.successScore(x, r))}</td><td class="neg">${sg(MenfiEngine.failureScore(x, r))}</td></tr>`).join("")}</tbody></table></div>`;
    const out = [{ title: "روش بازی", lines: [`بازی دو تیمی است و ${n(r.hands)} دست دارد.`, `در هر دست هر تیم عدد خود را از ${n(3)} تا ${n(13)} ${r.hidden ? "پنهانی " : ""}ثبت می‌کند؛ یعنی دست‌کم این تعداد از ۱۳ دست‌برد را می‌گیرد.`] }];
    if (r.scoring === MenfiScoring.LEGACY) {

function rulesSections(list) {
  return list.map((x) => section(x.title, "star") + `<div class="panel flat rules">${x.lines.length ? `<ul>${x.lines.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}${x.html || ""}</div>`).join("");
}
function RulesScreen(sid, initial) {
  const st = { game: initial || (sid != null && getSession(sid) ? getSession(sid).game : "shalam"), joker: S.shalam.defaultJoker };
  return {
    name: "rules",
    view() {
      const s = sid != null ? getSession(sid) : null;
      let body = "";
      if (!s) {
        body += `<div class="chips">${GAME_LIST.map((g) => chip(g.title, st.game === g.key, () => { st.game = g.key; refresh(); }, { gold: true, id: "rules-" + g.key })).join("")}${chip("لیگ", st.game === "league", () => { st.game = "league"; refresh(); }, { gold: true, id: "rules-league" })}</div>`;
        if (st.game === "shalam") body += `<div class="grid g2">${chip("بدون جوکر", !st.joker, () => { st.joker = false; refresh(); }, { id: "rules-nojoker" })}${chip("با جوکر", st.joker, () => { st.joker = true; refresh(); }, { id: "rules-joker" })}</div>`;
      }
      const game = s ? s.game : st.game;
      body += `<div style="text-align:center">${game === "league" ? `<span style="display:inline-block;color:var(--gold)">${ic("league")}</span>` : seal(game, 76)}<h2 class="goldt" style="font-size:1.25rem;font-weight:800">${esc(game === "league" ? "لیگ‌ها" : gameOf(game).title)}</h2></div>`;
      body += rulesSections(game === "league" ? RulesText.league(S.league) : RulesText.full(game, s ? s.rules : rulesFor(S, game, st.joker)));
      if (!s) body += btn("تغییر این قوانین در تنظیمات", () => push(SettingsScreen(game)), { kind: "ghost", icon: "sliders", id: "rules-settings" });
      return { title: s ? "قوانین این بازی" : "قوانین بازی", subtitle: s ? "بر اساس قوانین ثبت‌شده برای همین بازی" : "بر اساس تنظیمات فعلی برنامه", body };
    }
  };
}

const formatName = (l) => (l.format === LeagueFormat.ROUND_ROBIN ? "دوره‌ای" + (l.config.doubleRoundRobin ? " • رفت و برگشت" : "") : l.config.winsNeeded === 2 ? "حذفی «دو برده»" : `حذفی (${n(l.config.winsNeeded)} برد)`);
function syncLeagueObj(l) {
  let guard = 0, changed = false;
  while (guard++ < 20 && LeagueEngine.advance(l, getSession)) changed = true;
  if (changed) { l.updatedAt = Date.now(); repo.saveLeague(l); }
  return l;
}

function LeagueScreen(lid) {
  function playMatch(l, m) {
    const ms = LeagueEngine.state(l, m, getSession);
    if (ms.openGame != null && getSession(ms.openGame)) { push(boardFor(ms.openGame)); return; }
    const id = repo.newSessionId();
    const title = LeagueEngine.stageTitle(l, m.stage, n);
    const s = mkSession(id, l.game, [l.teams[ms.teamA], l.teams[ms.teamB]], [], clone(l.rules), {
      updatedAt: id, leagueId: l.id, label: l.name + " • " + title + (ms.isDecider ? " • فینال" : "")
    });
    live.set(id, s);
    repo.save(s);
    m.games.push(id);
    l.updatedAt = Date.now();
    repo.saveLeague(l);
    push(boardFor(id));
  }
  function matchCard(l, m) {
    const ms = LeagueEngine.state(l, m, getSession);
    const team = (t) => (t != null ? l.teams[t] : null);
    if (isBye(m)) {
      const a = team(ms.teamA);
      return `<div class="panel flat match" id="match-${m.id}"><div class="row">${a ? emblem(a.avatar, 34) : ""}<b class="grow">${a ? esc(a.name) : "در انتظار برندهٔ مرحلهٔ قبل"}</b>${badge("استراحت", "turq")}</div><span class="cap">بدون بازی به مرحلهٔ بعد می‌رود.</span></div>`;
    }
    const a = team(ms.teamA), b = team(ms.teamB);

    if (ms.ready && !ms.decided && ms.teamB != null) {
      const label = ms.openGame != null ? "ادامهٔ بازی" : ms.isDecider ? "شروع بازی فینال" : "شروع بازی " + n(ms.played + 1);
      h += btn(label, () => playMatch(l, m), { kind: ms.openGame != null ? "success" : "primary", icon: "play", cls: "block sm", id: "match-play-" + m.id });

  }

    name: "league",
    view() {

      if (!l0) return { title: "لیگ پیدا نشد", body: emptyState("league", "این لیگ دیگر وجود ندارد", "ممکن است حذف شده باشد.") };

      }
      LeagueEngine.stages(l).forEach((stage) => {
        body += section(LeagueEngine.stageTitle(l, stage, n), "league");
        body += `<div class="stack">${l.matches.filter((m) => m.stage === stage).map((m) => matchCard(l, m)).join("")}</div>`;

      const del = ibtn("trash", "حذف لیگ", () => confirmBox("حذف لیگ", "جدول این لیگ حذف شود؟ بازی‌های آن در تاریخچه می‌مانند.", "حذف", true, () => { repo.deleteLeague(lid); pop(); }), { id: "league-delete" });
      const shareBtn = ibtn("share", "اشتراک تصویر لیگ", () => shareLeague(l), { id: "league-share" });
      return { title: l.name, subtitle: champ != null ? "پایان‌یافته" : "در جریان", actions: shareBtn + del, body };
    }
  };
}

/* ================= Charts (inline SVG), share images (canvas), ratings, profiles, backup ================= */

/* Chart palette: brand tokens in a fixed order (validated for CVD / normal-vision separation on the panel surface). */
const CHART_COLORS = ["#E6BE6A", "#2ED3C6", "#E26571", "#6C95EE", "#F8F0DC", "#B884E8"];
const axisNum = (v) => (v < 0 ? "−" + n(-v) : n(v));
const CHARTS = new Map();
let chartSeq = 0;

function niceTicks(min, max, count = 4) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((x) => x >= raw) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
/**
 * Line chart. series: [{name, color, ys:[number]}], xs: x labels (same length as ys).
 * One y axis, recessive grid, 2px lines, end markers, legend for >= 2 series, hover/tap crosshair tooltip, table view.
 */
function lineChart(o) {
  const id = "chart-" + (++chartSeq);
  const W = 360, H = o.height || 210, L = 44, R = 12, T = 12, B = 30;
  const all = o.series.flatMap((s) => s.ys).concat(o.baseline != null ? [o.baseline] : []);
  const ticks = niceTicks(Math.min(...all), Math.max(...all));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const N = o.xs.length;
  const px = (i) => (N <= 1 ? L + (W - L - R) / 2 : L + (i * (W - L - R)) / (N - 1));
  const py = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
  let g = "";
  ticks.forEach((t) => { g += `<line x1="${L}" x2="${W - R}" y1="${py(t).toFixed(1)}" y2="${py(t).toFixed(1)}" stroke="rgba(230,190,106,${t === 0 ? ".35" : ".13"})" stroke-width="1"/><text x="${L - 6}" y="${(py(t) + 4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#B3C3DD">${esc(axisNum(t))}</text>`; });
  if (o.baseline != null) g += `<line x1="${L}" x2="${W - R}" y1="${py(o.baseline).toFixed(1)}" y2="${py(o.baseline).toFixed(1)}" stroke="#F8F0DC" stroke-opacity=".35" stroke-dasharray="4 4"/>`;
  const every = Math.max(1, Math.ceil(N / 8));
  o.xs.forEach((x, i) => { if (i % every === 0 || i === N - 1) g += `<text x="${px(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="#B3C3DD">${esc(x)}</text>`; });
  if (o.xTitle) g += `<text x="${W - R}" y="${H - 1}" text-anchor="end" font-size="9.5" fill="#7487AE">${esc(o.xTitle)}</text>`;
  o.series.forEach((s) => {
    const pts = s.ys.map((v, i) => `${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(" ");
    if (N > 1) g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.ys.length - 1;
    g += `<circle cx="${px(last).toFixed(1)}" cy="${py(s.ys[last]).toFixed(1)}" r="4" fill="${s.color}" stroke="#0B1937" stroke-width="2"/>`;
  });
  g += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#F8F0DC" stroke-opacity=".5" stroke-width="1" visibility="hidden"/><g class="xhd"></g>`;
  CHARTS.set(id, { W, L, R, N, xs: o.xs, series: o.series, px, py, fmt: o.fmt || sg });
  const legend = o.series.length >= 2 ? `<div class="legend">${o.series.map((s) => `<span><i style="background:${s.color}"></i><bdi>${esc(s.name)}</bdi></span>`).join("")}</div>` : "";
  const table = `<details class="ctable"><summary>جدول داده‌ها</summary><div class="tablewrap"><table class="tbl" style="min-width:0"><thead><tr><th scope="col">${esc(o.xTitle || "")}</th>${o.series.map((s) => `<th scope="col">${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${o.xs.map((x, i) => `<tr><td>${esc(x)}</td>${o.series.map((s) => `<td>${(o.fmt || sg)(s.ys[i])}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  return `<div class="chart" id="${id}-wrap"><svg data-chart="${id}" viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="${esc(o.label || "نمودار")}">${g}</svg><div class="tip" id="${id}-tip" hidden></div>${legend}${table}</div>`;
}
function donutChart(parts, centerTop, centerBottom) {
  const total = parts.reduce((a, p) => a + p.value, 0);
  const r = 42, c = 2 * Math.PI * r;
  let off = 0, arcs = "";
  const gap = parts.filter((p) => p.value > 0).length > 1 ? 2 : 0;
  parts.forEach((p) => {
    if (!p.value) return;
    const len = (p.value / total) * c;
    arcs += `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.color}" stroke-width="16" stroke-dasharray="${Math.max(0, len - gap).toFixed(2)} ${(c - Math.max(0, len - gap)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;
    off += len;
  });
  if (!total) arcs = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="#1D3B7C" stroke-width="16"/>`;
  return `<div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(parts.map((p) => p.label + " " + n(p.value)).join("، "))}">${arcs}<text x="60" y="60" text-anchor="middle" font-size="19" font-weight="800" fill="#FBE3A6">${esc(centerTop)}</text><text x="60" y="78" text-anchor="middle" font-size="10" fill="#B3C3DD">${esc(centerBottom)}</text></svg><div class="legend col">${parts.map((p) => `<span><i style="background:${p.color}"></i>${esc(p.label)} <b class="num">${n(p.value)}</b></span>`).join("")}</div></div>`;
}
function chartPointer(e) {
  const svg = e.target && e.target.closest ? e.target.closest("svg[data-chart]") : null;
  document.querySelectorAll(".chart .tip:not([hidden])").forEach((t) => { if (!svg || t.id !== svg.getAttribute("data-chart") + "-tip") { t.hidden = true; const s2 = t.parentNode.querySelector("svg .xh"); if (s2) s2.setAttribute("visibility", "hidden"); const d2 = t.parentNode.querySelector("svg .xhd"); if (d2) d2.innerHTML = ""; } });
  if (!svg) return;
  const id = svg.getAttribute("data-chart"), c = CHARTS.get(id);
  if (!c) return;
  const rect = svg.getBoundingClientRect();
  const vx = ((e.clientX - rect.left) / rect.width) * c.W;
  const i = c.N <= 1 ? 0 : clamp(Math.round(((vx - c.L) / (c.W - c.L - c.R)) * (c.N - 1)), 0, c.N - 1);
  const x = c.px(i);
  const xh = svg.querySelector(".xh"); xh.setAttribute("x1", x); xh.setAttribute("x2", x); xh.setAttribute("visibility", "visible");
  svg.querySelector(".xhd").innerHTML = c.series.map((s) => `<circle cx="${x.toFixed(1)}" cy="${c.py(s.ys[i]).toFixed(1)}" r="4.5" fill="${s.color}" stroke="#0B1937" stroke-width="2"/>`).join("");
  const tip = document.getElementById(id + "-tip");
  tip.innerHTML = `<b>${esc(c.xs[i])}</b>` + c.series.slice().sort((a, b) => b.ys[i] - a.ys[i]).map((s) => `<span><i style="background:${s.color}"></i><bdi>${esc(s.name)}</bdi> <b class="num">${c.fmt(s.ys[i])}</b></span>`).join("");
  tip.hidden = false;
  const wrapRect = svg.parentNode.getBoundingClientRect();
  const left = (x / c.W) * rect.width + (rect.left - wrapRect.left);
  tip.style.left = clamp(left - tip.offsetWidth / 2, 0, Math.max(0, wrapRect.width - tip.offsetWidth)) + "px";
}
document.addEventListener("pointermove", chartPointer);
document.addEventListener("pointerdown", chartPointer);

/* ---------- game chart: cumulative totals per side after each hand ---------- */
function totalsHidden(s) {
  const t = topScreen();
  return s.game === "menfi" && s.rules.menfi.hidden && !s.finished && !(t && t.sid === s.id && t.revealed);
}
function gameChart(s) {
  const rows = s.rounds.filter((r) => r.kind !== K.DOLO_ELIM);
  if (!rows.length) return emptyState("chart", "هنوز دستی ثبت نشده", "پس از ثبت دست‌ها، روند امتیاز هر طرف اینجا دیده می‌شود.");
  let shown = s.sides.map((_, i) => i);
  if (shown.length > 6) shown = GameEngine.ranking(s).slice(0, 6).sort((a, b) => a - b);
  const cum = s.sides.map(() => [0]);
  rows.forEach((r) => s.sides.forEach((_, i) => cum[i].push(cum[i][cum[i].length - 1] + score(r, i))));

      body += `<div class="stack tight">${table.list.map((p, k) => `<button type="button" class="panel ${k === 0 ? "raised" : "flat"} tap rank rkrow" id="rk-${k}" aria-label="${esc(p.name)}، امتیاز ${rn(p.rating)}" data-a="${on(() => openProfile(p.name, p.isTeam))}"><span class="place${k === 0 ? " p1" : k === 1 ? " p2" : ""}">${n(k + 1)}</span>${emblem(p.avatar, 36)}<span class="nm"><b>${esc(p.name)}</b><span class="cap">${wdl(p)} • ${pct(p.winRate)}</span>${bar(p.winRate, true)}</span><span class="tot goldt">${rn(p.rating)}</span></button>`).join("")}</div>`;
      const rec = Ratings.records(sessions, table);
      body += section("رکوردها", "star");
      const recRow = (id, title, r, text) => `<div class="panel flat srow" id="${id}"><div class="st"><b>${esc(title)}</b><span>${r ? text : "—"}</span></div>${r ? `<b class="goldt num" style="font-size:1.2rem">${typeof r.value === "number" ? n(r.value) : esc(r.value)}</b>` : ""}</div>`;
      body += recRow("rec-top", "بیشترین جمع امتیاز در یک بازی", rec.top, rec.top ? `${esc(rec.top.name)} • ${esc(gameOf(rec.top.game).title)}` : "");
      body += recRow("rec-margin", "بزرگ‌ترین اختلاف برد", rec.margin, rec.margin ? `${esc(rec.margin.name)} • ${esc(gameOf(rec.margin.game).title)}` : "");
      body += recRow("rec-streak", "طولانی‌ترین زنجیرهٔ برد", rec.streak, rec.streak ? esc(rec.streak.name) + " • برد پیاپی" : "");
      body += recRow("rec-most", "بیشترین بازی", rec.most, rec.most ? esc(rec.most.name) + " • بازی پایان‌یافته" : "");
      return { title: "رنک‌بندی", subtitle: `${st.teams ? "تیم‌ها" : "بازیکنان"} • ${n(table.list.length)} ${st.teams ? "تیم" : "بازیکن"}`, body };
    }
  };
}

function ProfileScreen(name, isTeam) {
  function data() {
    const sessions = sessionsFor(isTeam, null);
    const table = Ratings.compute(sessions);
    const p = table.byKey.get(Ratings.keyOf(name, isTeam)) || null;
    const mine = sessions.filter((s) => s.sides.some((x) => x.name === name));
    return { sessions, table, p, mine };
  }
  function share() {
    const { table, p } = data();
    if (!p) { toast("هنوز بازی پایان‌یافته‌ای ثبت نشده"); return; }
    const rank = table.list.indexOf(p) + 1;
    showShareImage({
      avatar: p.avatar, kicker: isTeam ? "کارنامهٔ تیم" : "کارنامهٔ بازیکن", title: p.name, subtitle: `سطح ${TIER[Ratings.tier(p.rating)][0]} • رتبهٔ ${n(rank)} از ${n(table.list.length)}`,
      date: jdate(Date.now()), banner: "امتیاز " + rn(p.rating),
      stats: [["بازی", n(p.games)], ["برد", n(p.wins)], ["مساوی", n(p.draws)], ["باخت", n(p.losses)], ["درصد برد", pct(p.winRate)], ["بهترین زنجیره", n(p.bestWinStreak)]]
    }, "divan-profile");
  }
  return {
    name: "profile",
    view() {
      const { table, p, mine } = data();
      const avatar = p ? p.avatar : (repo.roster().find((e) => e.name === name && e.isTeam === isTeam) || { avatar: 0 }).avatar;
      const rating = p ? p.rating : Ratings.START;
      const rank = p ? table.list.indexOf(p) + 1 : null;
      let body = `<div class="panel raised profile-head" id="profile-head">${emblem(avatar, 84)}<div class="grow"><b class="goldt pname">${esc(name)}</b><div class="row" style="gap:6px;flex-wrap:wrap">${tierBadge(rating)}${badge(isTeam ? "تیم" : "بازیکن", "gold")}${rank ? `<span class="cap">رتبهٔ ${n(rank)} از ${n(table.list.length)}</span>` : ""}</div></div><div class="prating"><span class="cap">امتیاز</span><b class="big">${rn(rating)}</b></div></div>`;
      if (!p) {
        body += emptyState("trophy", "هنوز بازی پایان‌یافته‌ای نیست", "پس از پایان اولین بازی، امتیاز و کارنامه اینجا ساخته می‌شود.");
      } else {
        const tiles = [["بازی", n(p.games)], ["برد", n(p.wins)], ["باخت", n(p.losses)], ["مساوی", n(p.draws)], ["درصد برد", pct(p.winRate)], ["بهترین زنجیره", n(p.bestWinStreak)]];
        body += `<div class="grid g3" id="profile-tiles">${tiles.map(([l, v]) => `<div class="panel flat stat"><b class="num">${v}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
        const cur = p.streak.count ? `زنجیرهٔ فعلی: ${n(p.streak.count)} ${p.streak.kind === "W" ? "برد" : p.streak.kind === "L" ? "باخت" : "مساوی"} پیاپی` : "";
        body += section("برد، مساوی، باخت", "chart");
        body += `<div class="panel flat">${donutChart([{ label: "برد", value: p.wins, color: "#2ED3C6" }, { label: "مساوی", value: p.draws, color: "#E6BE6A" }, { label: "باخت", value: p.losses, color: "#E26571" }], pct(p.winRate), "درصد برد")}${cur ? `<p class="cap" style="text-align:center">${esc(cur)}</p>` : ""}</div>`;
        body += section("روند امتیاز", "chart");
        body += `<div class="panel flat">${lineChart({ series: [{ name: "امتیاز", color: "#E6BE6A", ys: [Ratings.START].concat(p.history.map((h) => Math.round(h.rating))) }], xs: [n(0)].concat(p.history.map((_, k) => n(k + 1))), xTitle: "بازی", baseline: Ratings.START, fmt: (v) => n(Math.round(v)), label: "روند امتیاز " + name, height: 190 })}</div>`;
        body += section("به تفکیک بازی", "cards");
        body += `<div class="stack tight">${Object.keys(p.byGame).map((g) => { const b = p.byGame[g]; return `<div class="panel flat row" style="padding:8px 10px 10px">${seal(g, 34)}<span class="grow"><b>${esc(gameOf(g).title)}</b><span class="cap" style="display:block">${wdl(b)}</span></span><b class="num goldt">${n(b.games)} بازی</b></div>`; }).join("")}</div>`;
        if (isTeam && (p.pointsFor || p.pointsAgainst)) body += `<div class="panel flat">${kvRows([["امتیاز زده", sg(p.pointsFor)], ["امتیاز خورده", sg(p.pointsAgainst)], ["تفاضل", sg(p.pointsFor - p.pointsAgainst)]])}</div>`;
        const h2h = Object.values(p.h2h).sort((a, b) => b.games - a.games);
        body += section("رودررو", "players");
        body += h2h.length ? `<div class="stack tight">${h2h.map((h, k) => {
          const opp = table.byKey.get(h.key);
          const [label, kind] = STRENGTH[Ratings.strength(opp ? opp.rating : h.lastOppRating, p.rating)];
          return `<button type="button" class="panel flat tap pline" id="h2h-${k}" data-a="${on(() => openProfile(h.name, isTeam))}">${emblem(opp ? opp.avatar : 0, 30)}<span class="nm">${esc(h.name)}<span class="cap" style="display:block">${wdl(h)} • امتیاز ${rn(opp ? opp.rating : h.lastOppRating)}</span></span><span class="badge ${kind}">${esc(label)}</span></button>`;
        }).join("")}</div>` : emptyState("players", "رویارویی ثبت نشده", "");
        body += `<div class="panel flat" id="profile-best">${kvRows([
          ["بهترین برد", p.bestWin ? `${esc(p.bestWin.name)} (${rn(p.bestWin.oppRating)})` : "—"],
          ["بدترین باخت", p.worstLoss ? `${esc(p.worstLoss.name)} (${rn(p.worstLoss.oppRating)})` : "—"]
        ])}</div>`;
      }
      body += section("بازی‌های اخیر", "history");
      const res = new Map(p ? p.sessions.map((x) => [x.sid, x]) : []);
      body += mine.length ? `<div class="stack tight">${mine.slice(0, 10).map((s) => {
        const i = s.sides.findIndex((x) => x.name === name);
        const t = GameEngine.totals(s);
        const r = res.get(s.id);
        const hidden = s.game === "menfi" && s.rules.menfi.hidden && !s.finished;
        const tag = !s.finished ? badge("در جریان", "solid") : r ? badge(r.result === "W" ? "برد" : r.result === "L" ? "باخت" : "مساوی", r.result === "W" ? "turq" : r.result === "L" ? "red" : "gold") : "";
        return `<button type="button" class="panel flat tap pline" id="recent-${s.id}" data-a="${on(() => openSession(s))}">${seal(s.game, 30)}<span class="nm">${esc(gameOf(s.game).title)}<span class="cap" style="display:block">${jdate(s.endedAt != null ? s.endedAt : s.updatedAt)}${r ? " • امتیاز " + sg(Math.round(r.delta)) : ""}</span></span>${tag}<b class="num ${hidden ? "dimt" : sc(t[i])}">${hidden ? "•••" : sg(t[i])}</b></button>`;
      }).join("")}</div>` : emptyState("history", "بازی‌ای پیدا نشد", "");
      return { title: name, subtitle: isTeam ? "کارنامهٔ تیم" : "کارنامهٔ بازیکن", actions: ibtn("share", "اشتراک تصویر", share, { id: "profile-share" }), body };
    }
  };
}

/* ---------- league share image ---------- */
function shareLeague(l) {
  const champ = LeagueEngine.champion(l, getSession);
  const last = l.matches.length ? Math.max(...l.matches.map((m) => m.stage)) : 0;
  let rows;
  if (l.format === LeagueFormat.ROUND_ROBIN) {
    rows = LeagueEngine.standings(l, getSession).slice(0, 10).map((r, k) => ({ name: l.teams[r.team].name, avatar: l.teams[r.team].avatar, place: k + 1, value: n(r.leaguePoints), sub: `${n(r.won)} برد • ${n(r.drawn)} مساوی • ${n(r.lost)} باخت • تفاضل ${sg(r.diff)}`, crown: champ === r.team }));
  } else {
    const reach = l.teams.map((_, t) => {
      let stage = 0, wins = 0;
      l.matches.forEach((m) => { const ms = LeagueEngine.state(l, m, getSession); if (ms.teamA === t || ms.teamB === t) { stage = Math.max(stage, m.stage); wins += ms.teamA === t ? ms.winsA : ms.teamB === t ? ms.winsB : 0; } });
      return { t, stage, wins };
    }).sort((a, b) => (b.t === champ) - (a.t === champ) || b.stage - a.stage || b.wins - a.wins || a.t - b.t);
    rows = reach.slice(0, 10).map((x, k) => ({ name: l.teams[x.t].name, avatar: l.teams[x.t].avatar, place: k + 1, value: n(x.wins) + " برد", sub: x.stage ? "تا " + LeagueEngine.stageTitle(l, x.stage, n) : "", crown: champ === x.t }));
  }
  showShareImage({
    seal: l.game, kicker: "لیگ " + gameOf(l.game).title, title: l.name, subtitle: formatName(l) + " • " + n(l.teams.length) + " تیم", date: jdate(l.updatedAt),
    banner: champ != null ? "♛ قهرمان: " + l.teams[champ].name : "در جریان" + (last ? " • " + LeagueEngine.stageTitle(l, last, n) : ""),
    rows, more: l.teams.length > 10 ? `و ${n(l.teams.length - 10)} تیم دیگر` : ""
  }, "divan-league-" + l.id);
}

/* ================= Backup ================= */
function BackupScreen() {
  const st = { importText: "", parsed: null, fileName: "" };
  const counts = () => { const r = repo.roster(); return { games: repo.index().length, leagues: repo.leagueIndex().length, teams: r.filter((e) => e.isTeam).length, players: r.filter((e) => !e.isTeam).length }; };
  function copy() {
    const ta = document.getElementById("bk-export");
    const text = ta ? ta.value : "";
    const fallback = () => {
      let ok = false;
      try { if (ta) { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); } ok = document.execCommand && document.execCommand("copy"); } catch (e) { ok = false; }
      toast(ok ? "متن پشتیبان کپی شد" : "متن انتخاب شد؛ آن را کپی کنید");
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => toast("متن پشتیبان کپی شد"), fallback); return; }
    } catch (e) { /* clipboard blocked */ }
    fallback();
  }
  function check(text) {
    st.importText = text;
    st.parsed = text.trim() ? Backup.parse(text) : { ok: false, error: "متن پشتیبان را بچسبانید یا فایل را انتخاب کنید" };
    refresh();
  }
  function readFile(_, el) {
    const f = el && el.files && el.files[0];
    if (!f) return;
    st.fileName = f.name;
    try {
      const fr = new FileReader();
      fr.onload = () => check(String(fr.result || ""));
      fr.onerror = () => { st.parsed = { ok: false, error: "خواندن فایل ممکن نشد" }; refresh(); };
      fr.readAsText(f);
    } catch (e) { st.parsed = { ok: false, error: "خواندن فایل ممکن نشد" }; refresh(); }
  }
  function doImport(mode) {
    const res = Backup.apply(repo, st.parsed.data, mode);
    live.clear();
    S = repo.settings(); applyScale();
    repo.leagues().forEach(syncLeagueObj);
    st.parsed = null; st.importText = ""; st.fileName = "";
    const upd = res.sessionsUpdated + res.leaguesUpdated;
    toast(`${n(res.sessionsAdded)} بازی، ${n(res.leaguesAdded)} لیگ و ${n(res.rosterAdded)} نام افزوده شد${upd ? ` • ${n(upd)} مورد به‌روز شد` : ""}`);
    refresh();
  }
  return {
    name: "backup",
    view() {
      const c = counts();
      const text = JSON.stringify(Backup.build(repo));
      let body = section("خروجی گرفتن", "share");
      body += `<div class="panel flat stack tight" id="bk-export-panel"><div class="grid g4 bkcounts">${[["بازی", c.games], ["لیگ", c.leagues], ["تیم", c.teams], ["بازیکن", c.players]].map(([l, v]) => `<div class="stat"><b class="num">${n(v)}</b><span>${l}</span></div>`).join("")}</div><p class="cap">این متن را کپی کنید و در فایلی با پسوند ‎.json‎ نگه دارید؛ در نسخهٔ اندروید هم قابل بازگردانی است.</p><textarea id="bk-export" class="field code" readonly rows="5" aria-label="متن پشتیبان" spellcheck="false">${esc(text)}</textarea>${btn("کپی", copy, { kind: "primary", icon: "copy", cls: "block", id: "bk-copy" })}</div>`;
      body += section("بازگردانی", "backup");
      body += `<div class="panel flat stack tight"><p class="cap">فایل پشتیبان (‎.json‎) را انتخاب کنید یا متن آن را اینجا بچسبانید.</p><label class="btn secondary block" for="bk-file">${ic("backup")}<span>${st.fileName ? esc(st.fileName) : "انتخاب فایل پشتیبان"}</span></label><input type="file" id="bk-file" class="sr" accept=".json,application/json,text/plain" data-c="${on(readFile)}"><textarea id="bk-import" class="field code" rows="4" aria-label="متن پشتیبان برای بازگردانی" placeholder="متن پشتیبان را اینجا بچسبانید" spellcheck="false" data-i="${on((t) => { st.importText = t; })}">${esc(st.importText)}</textarea>${btn("بررسی متن پشتیبان", () => check(st.importText), { kind: "secondary", icon: "check", cls: "block", id: "bk-check" })}</div>`;
      if (st.parsed && !st.parsed.ok) body += `<p class="err" id="bk-error">${esc(st.parsed.error)}</p>`;
      if (st.parsed && st.parsed.ok) {
        const d = st.parsed.data;
        body += `<div class="panel sel stack" id="bk-preview"><b class="goldt">پیش‌نمایش پشتیبان</b>${kvRows([
          ["منبع", st.parsed.app === "android" ? "اندروید" : st.parsed.app === "web" ? "نسخهٔ وب" : esc(st.parsed.app || "—")],
          ["تاریخ", st.parsed.exportedAt ? jdate(st.parsed.exportedAt) : "—"],
          ["بازی", n(d.sessions.length)], ["لیگ", n(d.leagues.length)],
          ["تیم / بازیکن", `${n(d.roster.filter((e) => e.isTeam).length)} / ${n(d.roster.filter((e) => !e.isTeam).length)}`],
          ["تنظیمات", d.settings ? "دارد" : "ندارد"]
        ])}${btn("افزودن به داده‌های فعلی", () => doImport("merge"), { kind: "primary", icon: "plus", cls: "block", id: "bk-merge" })}${btn("جایگزینی کامل", () => confirmBox("جایگزینی کامل", "همهٔ بازی‌ها، لیگ‌ها، فهرست نام‌ها و تنظیمات فعلی پاک و با این پشتیبان جایگزین شوند؟", "جایگزینی", true, () => doImport("replace")), { kind: "danger", icon: "trash", cls: "block", id: "bk-replace" })}<p class="cap">«افزودن» بازی‌ها و لیگ‌های تازه را اضافه و نسخه‌های قدیمی‌تر را به‌روز می‌کند؛ تنظیمات فعلی دست نمی‌خورد.</p></div>`;
      }
      return { title: "پشتیبان‌گیری", subtitle: "انتقال داده‌ها بین گوشی و نسخهٔ وب", body };
    }
  };
}
/* ================= boot ================= */
try { document.documentElement.setAttribute("dir", "rtl"); document.documentElement.setAttribute("lang", "fa"); } catch (e) { /* ignore */ }
applyScale();
stack = [SplashScreen()];
render(true);
</script>
