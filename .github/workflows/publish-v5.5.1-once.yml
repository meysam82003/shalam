name: Dispatch Divan Emtiaz v5.5.1 release once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v5.5.1-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: "${{ github.event.head_commit.message == 'chore(release): dispatch v5.5.1 once' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Trigger existing signed all-platforms release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run all-platforms.yml --repo "${{ github.repository }}" --ref main --raw-field publish=true
