name: Test, build and publish Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub Release and the web page (only with the owner''s approval)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare release signing key
        env:
          DIVAN_KEYSTORE_BASE64: ${{ secrets.DIVAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DIVAN_KEYSTORE_BASE64" ]; then
            echo "$DIVAN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/divan-release.jks"
            echo "DIVAN_KEYSTORE_FILE=$RUNNER_TEMP/divan-release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release key found; APK is signed with the fixed release key."
          else
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No DIVAN_KEYSTORE_BASE64 secret: this run only tests (its APK is debug-signed and is never published)."
          fi

      - name: Test and build signed APK
        env:
          DIVAN_KEYSTORE_PASSWORD: ${{ secrets.DIVAN_KEYSTORE_PASSWORD }}
          DIVAN_KEY_ALIAS: ${{ secrets.DIVAN_KEY_ALIAS }}
          DIVAN_KEY_PASSWORD: ${{ secrets.DIVAN_KEY_PASSWORD }}
          # Public values for the Pro subscription (none is secret); empty ones keep the feature off.
          DIVAN_MYKET_RSA_KEY: ${{ vars.DIVAN_MYKET_RSA_KEY || secrets.DIVAN_MYKET_RSA_KEY }}
          DIVAN_TAPSELL_APP_ID: ${{ vars.DIVAN_TAPSELL_APP_ID || secrets.DIVAN_TAPSELL_APP_ID }}
          DIVAN_LICENSE_KEY: ${{ vars.DIVAN_LICENSE_KEY || secrets.DIVAN_LICENSE_KEY }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Check the server
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE divan_test2 CHARACTER SET utf8mb4; CREATE USER 'divan'@'localhost' IDENTIFIED BY 'ci-only'; GRANT ALL ON divan_test2.* TO 'divan'@'localhost';"
          for f in $(find server payment-bridge -name '*.php'); do php -l "$f" > /dev/null; done
          php payment-bridge/divan-bridge/tests/run.php
          DIVAN_TEST_DSN="host=localhost;dbname=divan_test2" DIVAN_TEST_PASS=ci-only php server/tests/run.php

      - name: Prepare release files
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk "Divan-Emtiaz-Bazaar-v$VERSION.apk"
          cp app/build/outputs/apk/myket/release/app-myket-release.apk "Divan-Emtiaz-Myket-v$VERSION.apk"
          cp web/index.html "Divan-Emtiaz-Web-v$VERSION.html"
          rm -rf pack && mkdir -p pack && cp -r server/public pack/divan && (cd pack && zip -qr ../Divan-Emtiaz-Web-Installer.zip divan)
          sha256sum Divan-Emtiaz-*-v$VERSION.apk "Divan-Emtiaz-Web-v$VERSION.html" Divan-Emtiaz-Web-Installer.zip > SHA256SUMS.txt

      - name: Use the release-signed APK kept in the repository
        if: env.RELEASE_SIGNED != 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          FOUND=0
          for STORE in Bazaar Myket; do
            SIGNED="release/Divan-Emtiaz-$STORE-v$VERSION.apk"
            [ -f "$SIGNED" ] || continue
            "$APKSIGNER" verify --print-certs "$SIGNED" | tee signed-cert.txt
            if grep -qi "CN=Android Debug" signed-cert.txt; then echo "::error::$SIGNED is debug-signed"; exit 1; fi
            cp "$SIGNED" "Divan-Emtiaz-$STORE-v$VERSION.apk"
            FOUND=$((FOUND+1))
          done
          if [ "$FOUND" = "2" ]; then
            sha256sum Divan-Emtiaz-*-v$VERSION.apk "Divan-Emtiaz-Web-v$VERSION.html" Divan-Emtiaz-Web-Installer.zip > SHA256SUMS.txt
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release-signed APKs found for v$VERSION."
          fi

      - name: Release notes from README
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"].translate(str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹"))
          text = open("README.md", encoding="utf-8").read()
          m = re.search(r"^## نسخهٔ " + re.escape(v) + r"\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else ""
          body = f"""نسخهٔ {os.environ['VERSION']}

          دانلود:
          - `Divan-Emtiaz-Bazaar-v{os.environ['VERSION']}.apk` برای کافه‌بازار (پرداخت با بازار)
          - `Divan-Emtiaz-Myket-v{os.environ['VERSION']}.apk` برای مایکت (پرداخت با مایکت)
          - `Divan-Emtiaz-Web-Installer.zip` سرور اشتراک و پنل مدیریت برای هاست
          هر دو APK امضای انتشار دارند و روی نسخهٔ قبلی نصب می‌شوند؛ داده‌ها حفظ می‌شوند.

          تازه‌ها:
          {notes}
          """
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(l.strip() if l.startswith("          ") else l for l in body.splitlines()) + "\n")
          PY
          cat release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-v${{ env.VERSION }}
          path: |
            Divan-Emtiaz-Bazaar-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Myket-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Web-v${{ env.VERSION }}.html
            Divan-Emtiaz-Web-Installer.zip
            SHA256SUMS.txt

      - name: Verify release signature
        if: env.RELEASE_SIGNED == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          WANT=$(grep -oP "DIVAN_CERT_SHA256'\) \?: '\K[0-9A-F]{64}" app/build.gradle)
          for STORE in Bazaar Myket; do
            "$APKSIGNER" verify --print-certs "Divan-Emtiaz-$STORE-v$VERSION.apk" | tee cert.txt
            GOT=$(grep -m1 'certificate SHA-256 digest' cert.txt | sed 's/.*: *//' | tr 'a-f' 'A-F')
            if [ "$GOT" != "$WANT" ]; then echo "::error::$STORE APK is not signed with the official key ($GOT)"; exit 1; fi
          done

      - name: Publish GitHub Release
        if: env.RELEASE_SIGNED == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: دیوان امتیاز سلطنتی v${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            Divan-Emtiaz-Bazaar-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Myket-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Web-v${{ env.VERSION }}.html
            Divan-Emtiaz-Web-Installer.zip
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true

  publish-web:
    needs: build-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web version
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy web version
        id: deploy
        uses: actions/deploy-pages@v4
