name: Test, build and publish Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build signed APK
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Divan-Emtiaz-v3.0.0.apk
          sha256sum Divan-Emtiaz-v3.0.0.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: دیوان امتیاز سلطنتی v3.0.0
          body: |
            نسخه ۳ دیوان امتیاز با هستهٔ داوری بازطراحی‌شده و UI/UX سلطنتی سه‌بعدی.

            - هزارتایی واقعی برای ۵ بازیکن یا بیشتر، کاملاً انفرادی
            - شلم با تعهد قابل تنظیم، یاسا، شلم، سرشلم و هدف امتیازی باز
            - منفی با حکم ثابت، پنهان‌سازی نتیجه، امتیاز پایه/پله‌ای و Override اعلام‌های ۱۱، ۱۲ و ۱۳
            - مدیریت گروه‌های دو نفره و آواتارهای سه‌بعدی
            - لیگ Round-robin تا دو برد و حالت تجمعی تا N دور یا امتیاز هدف
            - Room محلی، ذخیره خودکار، تاریخچه، ادامه بازی و Audit Log ویرایش‌ها
            - خروجی/بازیابی JSON برای انتقال بین گوشی‌ها
            - نمایش فاصله امتیاز در نتایج تیمی و انفرادی
            - Android 5.0 و بالاتر، آفلاین و بدون تبلیغ
          files: |
            Divan-Emtiaz-v3.0.0.apk
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
