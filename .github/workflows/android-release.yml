name: Test, build and publish Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fix launcher dp recursion for release build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/meysam/divanemtiaz/DivanFinalActivity.kt')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'private fun dp(value: Int): Int = this.dp(value)': 'private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()',
              'private fun dp(value: Int): Int = dp(value)': 'private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          final = p.read_text(encoding='utf-8')
          bad = [s for s in replacements if s in final]
          if bad:
              raise SystemExit(f'recursive dp() is still present: {bad}')
          expected = 'private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()'
          if expected not in final:
              raise SystemExit('safe dp() implementation was not installed')
          PY

      - name: Test and build signed APK
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-APK-Fixed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Divan-Emtiaz-v3.0.1.apk
          sha256sum Divan-Emtiaz-v3.0.1.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.1
          name: دیوان امتیاز سلطنتی v3.0.1
          body: |
            نسخه اصلاحی دیوان امتیاز با رفع کرش Launcher در شروع برنامه.

            - رفع StackOverflow در تبدیل dp
            - هزارتایی واقعی برای ۵ بازیکن یا بیشتر، کاملاً انفرادی
            - شلم با تعهد قابل تنظیم، یاسا، شلم، سرشلم و هدف امتیازی باز
            - منفی با حکم ثابت و پنهان‌سازی نتیجه
            - Room محلی، ذخیره خودکار، تاریخچه و Audit Log
            - Android 5.0 و بالاتر، آفلاین و بدون تبلیغ
          files: |
            Divan-Emtiaz-v3.0.1.apk
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
