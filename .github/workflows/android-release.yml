name: Test, build and publish Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build signed APK
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Prepare release files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Divan-Emtiaz-v2.0.0.apk
          sha256sum Divan-Emtiaz-v2.0.0.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: دیوان امتیاز سلطنتی v2.0.0
          body: |
            بازطراحی کامل دیوان امتیاز با هویت بصری سلطنتی سه‌بعدی.

            - آواتارها و مدل‌های سه‌بعدی ایرانی از اطلس‌های منتخب پروژه
            - شلم دو مرحله‌ای با پاس، ۱۰۰ تا ۱۶۰، شلم و دبل‌شلم
            - محاسبه خودکار ۱۶۵ منهای امتیاز حریف و ثبت شکست تعهد
            - منفی با اعداد ۳ تا ۱۳ و سه حالت نتیجه قبل از تأیید
            - ویرایش و حذف هر دست، تاریخچه و ادامه بازی
            - تنظیمات پیشرفتهٔ شلم بر اساس بررسی APK شلم‌شمار
            - فونت فارسی Vazirmatn و رابط کاملاً راست‌به‌چپ
            - Android 5.0 و بالاتر، آفلاین و بدون تبلیغ
          files: |
            Divan-Emtiaz-v2.0.0.apk
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
