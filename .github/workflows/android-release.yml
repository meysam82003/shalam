name: Test, build and publish Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare release signing key
        env:
          DIVAN_KEYSTORE_BASE64: ${{ secrets.DIVAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DIVAN_KEYSTORE_BASE64" ]; then
            echo "$DIVAN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/divan-release.jks"
            echo "DIVAN_KEYSTORE_FILE=$RUNNER_TEMP/divan-release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release key found; APK is signed with the fixed release key."
          else
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No DIVAN_KEYSTORE_BASE64 secret; APK is signed with the runner debug key and is NOT published as a release (Cafe Bazaar rejects debug-signed APKs)."
          fi

      - name: Test and build signed APK
        env:
          DIVAN_KEYSTORE_PASSWORD: ${{ secrets.DIVAN_KEYSTORE_PASSWORD }}
          DIVAN_KEY_ALIAS: ${{ secrets.DIVAN_KEY_ALIAS }}
          DIVAN_KEY_PASSWORD: ${{ secrets.DIVAN_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Prepare release files
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Divan-Emtiaz-v$VERSION.apk"
          cp web/index.html "Divan-Emtiaz-Web-v$VERSION.html"
          sha256sum "Divan-Emtiaz-v$VERSION.apk" "Divan-Emtiaz-Web-v$VERSION.html" > SHA256SUMS.txt

      - name: Use the release-signed APK kept in the repository
        if: env.RELEASE_SIGNED != 'true'
        run: |
          SIGNED="release/Divan-Emtiaz-v$VERSION.apk"
          if [ -f "$SIGNED" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
            "$APKSIGNER" verify --print-certs "$SIGNED" | tee signed-cert.txt
            if grep -qi "CN=Android Debug" signed-cert.txt; then echo "::error::$SIGNED is debug-signed"; exit 1; fi
            cp "$SIGNED" "Divan-Emtiaz-v$VERSION.apk"
            sha256sum "Divan-Emtiaz-v$VERSION.apk" "Divan-Emtiaz-Web-v$VERSION.html" > SHA256SUMS.txt
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Release-signed APK found for v$VERSION."
          fi

      - name: Release notes from README
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["VERSION"].translate(str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹"))
          text = open("README.md", encoding="utf-8").read()
          m = re.search(r"^## نسخهٔ " + re.escape(v) + r"\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else ""
          body = f"""نسخهٔ {os.environ['VERSION']}

          دانلود: فایل `Divan-Emtiaz-v{os.environ['VERSION']}.apk` (امضای انتشار، مناسب کافه‌بازار؛ روی نسخهٔ قبلی نصب می‌شود و داده‌ها حفظ می‌شوند)

          تازه‌ها:
          {notes}
          """
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(l.strip() if l.startswith("          ") else l for l in body.splitlines()) + "\n")
          PY
          cat release-notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-v${{ env.VERSION }}
          path: |
            Divan-Emtiaz-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Web-v${{ env.VERSION }}.html
            SHA256SUMS.txt

      - name: Verify release signature
        if: env.RELEASE_SIGNED == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Divan-Emtiaz-v$VERSION.apk" | tee cert.txt
          if grep -qi "CN=Android Debug" cert.txt; then echo "::error::APK is debug-signed"; exit 1; fi

      - name: Publish unsigned build for re-signing
        if: env.RELEASE_SIGNED != 'true' && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ساخت آزمایشی v${{ env.VERSION }} (امضای دیباگ؛ برای بازار نیست)
          prerelease: true
          make_latest: false
          body: |
            این فایل با کلید دیباگ امضا شده و برای کافه‌بازار قابل قبول نیست؛ فقط برای امضای مجدد با کلید انتشار است.
          files: |
            Divan-Emtiaz-v${{ env.VERSION }}.apk
          overwrite_files: true

      - name: Publish GitHub Release
        if: env.RELEASE_SIGNED == 'true' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: دیوان امتیاز سلطنتی v${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            Divan-Emtiaz-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Web-v${{ env.VERSION }}.html
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true

  publish-web:
    needs: build-release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web version
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy web version
        id: deploy
        uses: actions/deploy-pages@v4
