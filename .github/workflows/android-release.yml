name: Test, build and publish Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare release signing key
        env:
          DIVAN_KEYSTORE_BASE64: ${{ secrets.DIVAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DIVAN_KEYSTORE_BASE64" ]; then
            echo "$DIVAN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/divan-release.jks"
            echo "DIVAN_KEYSTORE_FILE=$RUNNER_TEMP/divan-release.jks" >> "$GITHUB_ENV"
            echo "Release key found; APK is signed with the fixed release key."
          else
            echo "No DIVAN_KEYSTORE_BASE64 secret; APK is signed with the runner debug key."
          fi

      - name: Test and build signed APK
        env:
          DIVAN_KEYSTORE_PASSWORD: ${{ secrets.DIVAN_KEYSTORE_PASSWORD }}
          DIVAN_KEY_ALIAS: ${{ secrets.DIVAN_KEY_ALIAS }}
          DIVAN_KEY_PASSWORD: ${{ secrets.DIVAN_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Prepare release files
        run: |
          VERSION=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Divan-Emtiaz-v$VERSION.apk"
          cp web/index.html "Divan-Emtiaz-Web-v$VERSION.html"
          sha256sum "Divan-Emtiaz-v$VERSION.apk" "Divan-Emtiaz-Web-v$VERSION.html" > SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-v${{ env.VERSION }}
          path: |
            Divan-Emtiaz-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Web-v${{ env.VERSION }}.html
            SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: دیوان امتیاز سلطنتی v${{ env.VERSION }}
          body: |
            نسخهٔ ${{ env.VERSION }} — اپ اندروید و نسخهٔ تحت وب

            دانلود:
            - اپ اندروید: فایل `Divan-Emtiaz-v${{ env.VERSION }}.apk` (روی نسخهٔ قبلی نصب می‌شود و داده‌ها حفظ می‌شوند)
            - نسخهٔ تحت وب: https://meysam82003.github.io/shalam/ یا فایل `Divan-Emtiaz-Web-v${{ env.VERSION }}.html` (بدون نصب، در هر مرورگری باز می‌شود)

            تازه‌های نسخهٔ ۴.۱:
            - ماشین‌حساب هزارتایی: فقط تعداد نفرات و ورق‌ها را بدهید؛ برنامه خودش ورق هر نفر و پخش دور اول، دوم و سوم را تعیین می‌کند (مثلاً ۶/۴/۴)
            - امکان وارد کردن تعداد کل ورق‌ها (مثلاً ۸۰ برگ) به جای تعداد دسته و جوکر
            - تساوی در منفی (عادی و لیگ): داور ۲، ۳ یا هر تعداد دست اضافه انتخاب می‌کند؛ پیش‌فرض در تنظیمات
            - پشتیبان‌گیری کامل (Import / Export): بازی‌ها، تاریخچه، تیم‌ها، بازیکنان، لیگ‌ها و تنظیمات؛ ادغام یا جایگزینی
            - اشتراک تصویر هر دست، وضعیت بازی، نتیجه، لیگ و پروفایل
            - نمودار روند امتیاز، پروفایل تیم و بازیکن (برد/مساوی/باخت، رودررو، قدرت حریف، بهترین برد و بدترین باخت)
            - رنک‌بندی تیم‌ها و بازیکنان با درجه‌های طلایی، نقره‌ای و برنزی

            از نسخهٔ ۴:
            - اندازهٔ درست صفحه و عدم همپوشانی با نوار سیستم
            - قوانین جدید منفی (جمع ۱۳، ۱۴ و ۱۵ به بالا) و جدول امتیاز قابل تنظیم
            - ثبت دستی امتیاز توسط داور در همهٔ بازی‌ها
            - هزارتایی با تعداد نامحدود بازیکن
            - لیگ حذفی «دو برده» و دوره‌ای
            - بازی جدید «دو لو گشنیز» و ماشین‌حساب ورق

            Android 5.0 و بالاتر، کاملاً آفلاین و بدون تبلیغ
          files: |
            Divan-Emtiaz-v${{ env.VERSION }}.apk
            Divan-Emtiaz-Web-v${{ env.VERSION }}.html
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true

  publish-web:
    needs: build-release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web version
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy web version
        id: deploy
        uses: actions/deploy-pages@v4
