name: Build and publish Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build signed APK
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk Divan-Emtiaz-v1.0.0.apk
          sha256sum Divan-Emtiaz-v1.0.0.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: دیوان امتیاز v1.0.0
          body: |
            نسخه نخست اندروید دیوان امتیاز

            - شلم، منفی و هزارتایی
            - امتیازدهی زنده و بازگردانی آخرین دست
            - تاریخچه آفلاین
            - رابط فارسی راست‌به‌چپ و تم سلطنتی
            - سازگار با Android 5.0 و بالاتر
          files: |
            Divan-Emtiaz-v1.0.0.apk
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true

