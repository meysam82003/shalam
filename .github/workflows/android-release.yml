name: Test, build and publish Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Apply requested V5 source fixes
        run: python3 tools/apply_v5_fixes.py

      - name: Verify requested fixes
        shell: bash
        run: |
          FILE=app/src/main/java/com/meysam/divanemtiaz/DivanFinalActivity.kt
          grep -q 'ShalamReferenceEngine.readyBids(settings)' "$FILE"
          grep -q 'handleMenfiAfterMutation' "$FILE"
          grep -q 'draft.input.parent as? ViewGroup' "$FILE"
          grep -q 'styleDivanDialog(dialog)' "$FILE"
          grep -q 'private fun dp(value: Int): Int = (value \* resources.displayMetrics.density).toInt()' "$FILE"
          ! grep -q 'private fun dp(value: Int): Int = this.dp(value)' "$FILE"
          ! grep -q 'برد پایه' "$FILE"
          ! grep -q 'باخت پایه' "$FILE"

      - name: Test and build signed APK
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-v3.0.2
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare release files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk Divan-Emtiaz-v3.0.2.apk
          sha256sum Divan-Emtiaz-v3.0.2.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.2
          name: دیوان امتیاز سلطنتی v3.0.2
          body: |
            نسخه اصلاحی قوانین و رابط کاربری دیوان امتیاز.

            - رفع کرش ورود به هزارتایی و پشتیبانی ۵ تا ۶۰ نفر
            - امتیاز منفی بر اساس اعلام همان دست: گرفتن = +اعلام، نگرفتن = -اعلام
            - نتیجه خودکار منفی پس از تکمیل تعداد دست‌ها؛ تساوی وارد دست اضافه می‌شود
            - شلم مبتنی بر قواعد بازیابی‌شده شلم‌شمار 6.2.1 با ۱۶۵/۲۰۰ و شلم ۳۳۰/۴۰۰
            - یکدست شدن دیالوگ نتیجه و ویرایش با UI سرمه‌ای/طلایی
            - حذف تنظیمات امتیازی قدیمی و نامرتبط منفی
            - Android 5.0 و بالاتر، آفلاین و بدون تبلیغ
          files: |
            Divan-Emtiaz-v3.0.2.apk
            SHA256SUMS.txt
          overwrite_files: true
          make_latest: true
