name: Validate game, subscription and advertising changes
on:
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: divan_test2
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl, dom
      - name: Lint all PHP files
        run: find server payment-bridge -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Server regression tests
        env:
          DIVAN_TEST_DSN: host=127.0.0.1;port=3306;dbname=divan_test2
          DIVAN_TEST_USER: root
          DIVAN_TEST_PASS: test
        run: php server/tests/run.php
      - name: Payment bridge tests
        run: php payment-bridge/divan-bridge/tests/run.php
  android-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android regression tests
        run: |
          set -o pipefail
          gradle --no-daemon testReleaseUnitTest 2>&1 | tee android-tests.log
      - name: Keep compiler and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Divan-5.6.1-compiler-diagnostics
          path: |
            android-tests.log
            app/build/test-results/
            admin-app/build/test-results/
      - name: Prepare release signing key
        id: key
        env:
          DIVAN_KEYSTORE_BASE64: ${{ secrets.DIVAN_KEYSTORE_BASE64 }}
          DIVAN_KEYSTORE_PASSWORD: ${{ secrets.DIVAN_KEYSTORE_PASSWORD }}
          DIVAN_KEY_ALIAS: ${{ secrets.DIVAN_KEY_ALIAS }}
          DIVAN_KEY_PASSWORD: ${{ secrets.DIVAN_KEY_PASSWORD }}
        run: |
          for v in DIVAN_KEYSTORE_BASE64 DIVAN_KEYSTORE_PASSWORD DIVAN_KEY_ALIAS DIVAN_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is missing: Android APKs are only signed with the official release key."; exit 1; fi
          done
          echo "$DIVAN_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/divan-release.jks"
          # The key itself must open and carry the official certificate before anything is built (nothing secret is printed).
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/divan-release.jks" -storepass:env DIVAN_KEYSTORE_PASSWORD -alias "$DIVAN_KEY_ALIAS" 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//; s/://g' | tr 'a-f' 'A-F')
          WANT=$(grep -oP "DIVAN_CERT_SHA256'\) \?: '\K[0-9A-F]{64}" app/build.gradle)
          if [ -z "$FP" ]; then echo "::error::The keystore did not open with the stored password and alias."; exit 1; fi
          if [ "$FP" != "$WANT" ]; then echo "::error::The stored key is not the official Divan Emtiaz key (certificate $FP)."; exit 1; fi
          echo "Official release key verified (certificate SHA-256 $FP)."
          echo "DIVAN_KEYSTORE_FILE=$RUNNER_TEMP/divan-release.jks" >> "$GITHUB_ENV"
          echo "DIVAN_CERT_WANT=$WANT" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test and build the Android APKs (Bazaar, Myket, site)
        if: steps.key.outputs.signed == 'true'
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          DIVAN_KEYSTORE_PASSWORD: ${{ secrets.DIVAN_KEYSTORE_PASSWORD }}
          DIVAN_KEY_ALIAS: ${{ secrets.DIVAN_KEY_ALIAS }}
          DIVAN_KEY_PASSWORD: ${{ secrets.DIVAN_KEY_PASSWORD }}
          DIVAN_MYKET_RSA_KEY: ${{ vars.DIVAN_MYKET_RSA_KEY || secrets.DIVAN_MYKET_RSA_KEY }}
          DIVAN_TAPSELL_APP_ID: ${{ vars.DIVAN_TAPSELL_APP_ID || secrets.DIVAN_TAPSELL_APP_ID }}
          DIVAN_LICENSE_KEY: ${{ vars.DIVAN_LICENSE_KEY || secrets.DIVAN_LICENSE_KEY }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify release signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for F in bazaar myket direct; do
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/$F/release/app-$F-release.apk | tee cert.txt
            GOT=$(grep -m1 'certificate SHA-256 digest' cert.txt | sed 's/.*: *//' | tr 'a-f' 'A-F')
            if [ "$GOT" != "$DIVAN_CERT_WANT" ]; then echo "::error::$F APK is not signed with the official key ($GOT)"; exit 1; fi
          done


      - name: Verify the dedicated administration APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs admin-app/build/outputs/apk/release/admin-app-release.apk
      - name: Build web/PWA from the shared game code
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        working-directory: webapp
        run: python3 build-play.py
      - uses: actions/upload-artifact@v4
        with:
          name: Divan-5.6.1-app-admin-server
          path: |
            app/build/outputs/apk/*/release/*.apk
            webapp/build/play/
            admin-app/build/outputs/apk/release/*.apk
            server/public/
            docs/iran-ads-admin-5.6.1.md
