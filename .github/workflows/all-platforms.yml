name: Build all versions (site APK, web/PWA, Windows, iPhone)

# Manual only. Builds every downloadable version as workflow artifacts. With «publish» it also puts them in the
# GitHub Release of this version (created or updated). Android APKs are signed with the fixed release key from the
# repository secrets; without it (the owner's choice while the app is unpublished) they are signed with the runner's
# temporary key, which the release notes say, and a later build may need a reinstall instead of an update.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the files in the GitHub Release of this version (only with the owner''s approval)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  android-and-web:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21 (web) and 17 (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Version
        id: ver
        run: echo "version=$(grep -oP "versionName '\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        id: key
        env:
          DIVAN_KEYSTORE_BASE64: ${{ secrets.DIVAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DIVAN_KEYSTORE_BASE64" ]; then
            echo "::warning::No DIVAN_KEYSTORE_BASE64 secret: the Android APKs are signed with a temporary key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$DIVAN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/divan-release.jks"
          echo "DIVAN_KEYSTORE_FILE=$RUNNER_TEMP/divan-release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Test and build the Android APKs (Bazaar, Myket, site)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          DIVAN_KEYSTORE_PASSWORD: ${{ secrets.DIVAN_KEYSTORE_PASSWORD }}
          DIVAN_KEY_ALIAS: ${{ secrets.DIVAN_KEY_ALIAS }}
          DIVAN_KEY_PASSWORD: ${{ secrets.DIVAN_KEY_PASSWORD }}
          DIVAN_MYKET_RSA_KEY: ${{ vars.DIVAN_MYKET_RSA_KEY || secrets.DIVAN_MYKET_RSA_KEY }}
          DIVAN_TAPSELL_APP_ID: ${{ vars.DIVAN_TAPSELL_APP_ID || secrets.DIVAN_TAPSELL_APP_ID }}
          DIVAN_LICENSE_KEY: ${{ vars.DIVAN_LICENSE_KEY || secrets.DIVAN_LICENSE_KEY }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify release signature
        if: steps.key.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for F in bazaar myket direct; do
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/$F/release/app-$F-release.apk | tee cert.txt
            if grep -qi "CN=Android Debug" cert.txt; then echo "::error::$F APK is debug-signed"; exit 1; fi
          done

      - name: Build the web version (PWA) and the iPhone profile
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        working-directory: webapp
        run: |
          python3 build-play.py
          python3 build-iphone.py
          python3 build-play.py --skip-teavm --channel windows --out ../desktop/play

      - name: Pack files
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "out/Divan-Emtiaz-Site-v$V.apk"
          cp app/build/outputs/apk/bazaar/release/app-bazaar-release.apk "out/Divan-Emtiaz-Bazaar-v$V.apk"
          cp app/build/outputs/apk/myket/release/app-myket-release.apk "out/Divan-Emtiaz-Myket-v$V.apk"
          (cd webapp/build && zip -qr "../../out/Divan-Emtiaz-Play-v$V.zip" play)
          cp webapp/build/iPhone.mobileconfig out/iPhone.mobileconfig
          # Packages for the host: introduction site, subscription server and panel, Iran payment bridge.
          git archive --format=zip HEAD:site -o "out/Divan-Site-v$V.zip"
          git archive --format=zip --prefix=divan/ HEAD:server/public -o "out/Divan-Server-v$V.zip"
          mkdir -p br && git archive HEAD:payment-bridge/public --prefix=public_pay/ | tar x -C br \
            && git archive HEAD:payment-bridge/divan-bridge --prefix=divan-bridge/ | tar x -C br && rm -rf br/divan-bridge/tests \
            && (cd br && zip -qr "../out/Divan-Payment-Bridge-Iran-v$V.zip" public_pay divan-bridge)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-Site-Web-iPhone-v${{ steps.ver.outputs.version }}
          path: out/*

      - uses: actions/upload-artifact@v4
        with:
          name: windows-play
          path: desktop/play
          retention-days: 1

  windows:
    needs: android-and-web
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-play
          path: desktop/play

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the Windows installer
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: Divan-Emtiaz-Windows-v${{ needs.android-and-web.outputs.version }}
          path: desktop/dist/*.exe

  publish:
    needs: [android-and-web, windows]
    if: inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Collect files and checksums
        run: |
          V=${{ needs.android-and-web.outputs.version }}
          mkdir -p rel
          cp dl/Divan-Emtiaz-Site-Web-iPhone-v$V/* rel/
          cp dl/Divan-Emtiaz-Windows-v$V/*.exe rel/
          (cd rel && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes
        env:
          V: ${{ needs.android-and-web.outputs.version }}
          SIGNED: ${{ needs.android-and-web.outputs.signed }}
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ["V"]; fa = v.translate(str.maketrans("0123456789", "۰۱۲۳۴۵۶۷۸۹"))
          text = open("README.md", encoding="utf-8").read()
          m = re.search(r"^## نسخهٔ " + re.escape(fa) + r"\s*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = m.group(1).strip() if m else ""
          android = (f"- `Divan-Emtiaz-Site-v{v}.apk` اندروید، نسخهٔ سایت (پرداخت با درگاه‌های اینترنتی)\n"
                     f"- `Divan-Emtiaz-Bazaar-v{v}.apk` و `Divan-Emtiaz-Myket-v{v}.apk` نسخه‌های کافه‌بازار و مایکت\n"
                     + ("همهٔ APKها با کلید انتشار ثابت امضا شده‌اند و روی نسخهٔ قبلی نصب می‌شوند."
                        if os.environ["SIGNED"] == "true" else
                        "APKهای این نسخه با کلید موقت امضا شده‌اند؛ اگر نسخهٔ دیگری از دیوان نصب است، اول آن را حذف کنید. برای انتشار در کافه‌بازار و مایکت باید با کلید اصلی امضا شوند."))
          body = f"""نسخهٔ {v} — همهٔ نسخه‌ها همان برنامه با همهٔ قابلیت‌ها هستند؛ فقط روش پرداخت فرق دارد.

          دریافت:
          {android}
          - `Divan-Emtiaz-Setup-v{v}.exe` ویندوز ۱۰ و ۱۱ (بدون امضای دیجیتال؛ در هشدار ویندوز More info ← Run anyway)
          - `iPhone.mobileconfig` میان‌بُر آیفون و آیپد (Web Clip نسخهٔ وب)
          - `Divan-Emtiaz-Play-v{v}.zip` نسخهٔ وب و PWA برای `/play/` سایت
          - `Divan-Site-v{v}.zip`، `Divan-Server-v{v}.zip` و `Divan-Payment-Bridge-Iran-v{v}.zip` بسته‌های هاست (سایت، سرور و پنل، واسط ایران)
          - `SHA256SUMS.txt` کد سلامت فایل‌ها

          تازه‌ها:
          {notes}
          """
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(l[10:] if l.startswith("          ") else l for l in body.splitlines()) + "\n")
          PY
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.android-and-web.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: دیوان امتیاز سلطنتی v${{ needs.android-and-web.outputs.version }}
          body_path: release-notes.md
          files: rel/*
          overwrite_files: true
          make_latest: true
