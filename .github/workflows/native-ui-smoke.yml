name: Native Android reward and preset smoke tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            arch: x86
          - api: 35
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate a local portrait video fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p app/src/androidTest/assets
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=0x16213e:s=720x1280:r=24 -t 8 -c:v libx264 -preset ultrafast -profile:v baseline -level 3.1 -pix_fmt yuv420p -movflags +faststart app/src/androidTest/assets/reward-fixture.mp4
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell wm size 720x1280
            adb shell wm density 320
            adb shell settings put system font_scale 1.3
            gradle --no-daemon -Pdivan.api=https://example.test/divan/api/index.php connectedBazaarDebugAndroidTest
            adb pull /sdcard/Android/data/com.meysam.divanemtiaz.debug/files/ui-smoke ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Divan-native-ui-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            ui-screenshots/
