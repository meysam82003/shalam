name: Validate Bazaar UI fixes

on:
  push:
    branches: ['fix/bazaar-ui-performance-v4.1.1']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Upload verification reports and UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-validation-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/ui-previews/
      - name: Upload APK for final private signing
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-unsigned-for-local-signing
          path: app/build/outputs/apk/release/*.apk

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.meysam.divanemtiaz.debug/files/smoke-previews app/build/emulator-previews
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-emulator-evidence
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/emulator-previews/
