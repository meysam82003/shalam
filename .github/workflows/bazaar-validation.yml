name: Validate Bazaar UI fixes

on:
  push:
    branches: ['fix/bazaar-ui-performance-v4.1.1']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Upload verification reports and UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-validation-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/ui-previews/
      - name: Upload APK for final private signing
        uses: actions/upload-artifact@v4
        with:
          name: bazaar-unsigned-for-local-signing
          path: app/build/outputs/apk/release/*.apk
