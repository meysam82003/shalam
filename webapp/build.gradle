plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'org.teavm' version '0.13.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}
kotlin { jvmToolchain(21) }
compileKotlin { kotlinOptions.jvmTarget = '11' }

dependencies {
    implementation teavm.libs.jsoApis
    // TeaVM's own runtime and class library (file system hook, executors); provided by TeaVM when compiling to JS.
    compileOnly 'org.teavm:teavm-core:0.13.1'
    compileOnly 'org.teavm:teavm-classlib:0.13.1'
}

teavm {
    js {
        mainClass = 'divan.web.Main'
        targetFileName = 'divan.js'
        obfuscated = false
    }
}

// The app's own sources (site version): compiled unchanged against the browser classes above.
sourceSets {
    main {
        kotlin.srcDirs += ['../app/src/main/java', '../app/src/direct/java']
    }
}
