plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.meysam.divanemtiaz'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meysam.divanemtiaz'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Produces an installable APK without publishing a private release key.
            // Store deployments should replace this with a GitHub Secrets-backed key.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

