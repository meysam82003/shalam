plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystore = System.getenv('DIVAN_KEYSTORE_FILE')

android {
    namespace 'com.meysam.divanemtiaz'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meysam.divanemtiaz'
        minSdk 21
        targetSdk 35
        versionCode 6
        versionName '4.1.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            // A fixed key keeps every new APK installable over the previous one.
            // CI provides it from GitHub Secrets; without it the debug key is used.
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('DIVAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DIVAN_KEY_ALIAS')
                keyPassword System.getenv('DIVAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
