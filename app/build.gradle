plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystore = System.getenv('DIVAN_KEYSTORE_FILE')

// Values for the Pro subscription; none of them is secret (public keys and addresses).
def setting = { String name, String env -> ((project.findProperty(name) ?: System.getenv(env) ?: '') as String).trim() }
def divanApi = setting('divan.api', 'DIVAN_API') ?: 'https://httpuser87890.ir/divan/api/index.php'
// Public key of the subscription server's certificates (from /v1/keys of the live server, kid 1ce0e85fcdca4bfb), pinned so
// a key swapped in the phone's storage can never sign a forged Pro certificate. A property or variable overrides it.
def divanLicenseKey = setting('divan.licenseKey', 'DIVAN_LICENSE_KEY') ?: ''
// Cafe Bazaar's public RSA key of this app (safe to commit): Poolakey checks every purchase's signature with it too.
def divanBazaarKey = setting('divan.bazaarKey', 'DIVAN_BAZAAR_RSA_KEY') ?: 'MIHNMA0GCSqGSIb3DQEBAQUAA4G7ADCBtwKBrwCbivNO6KdM5zzuOw4Z3AKHzSETm5dTZhlPV3dNARx/Ae+ny+AMGuO6DXyW5FSMwOBhs4k0wNwseEBkU1V1II7IRmna/2S/95Gqz+DcUA5ilxkxLlIpLAwi+D429RWYEMfx05ndBv4z0vjmDGb+2J9U21RCLLWXZL01ZkiopXS0zULVMPKTJU4dvIqtjV3rTvkoE+NPd42wsJ5fD6k4RCiHK0dba8ILe4lc75CGbx0CAwEAAQ=='
// Myket's public RSA key (safe to commit); per-build property or environment variable takes precedence.
def divanMyketKey = setting('divan.myketKey', 'DIVAN_MYKET_RSA_KEY') ?: 'MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCADyNgGC9nxkQGOJhwp/8wyI7aaftQ9v7E2PBaktHfIss9ZcD01MD0i1H2EVyaEPJRXgMiTaQMvdF7u1BP8V4IlcxR9HF17x0Il22eBL+q7nTTDFr5vkNJDi2wUzmMIRQzJAFkQHIeUKSkcY8i68GYCSS5lVtDMzi72F7uB3F3XQIDAQAB'
def divanTapsell = setting('divan.tapsellAppId', 'DIVAN_TAPSELL_APP_ID')
// SHA-256 of the official release signing certificate (the key of every published APK since 4.9.1). Release builds
// refuse Pro when the installed APK is signed with another key, and CI refuses to publish an APK that is not.
def divanCertSha256 = setting('divan.certSha256', 'DIVAN_CERT_SHA256') ?: 'BDF49332DE48F6E06E3D55C380A11479243AB404291151DF8DE1F9F4BF25D0AA'
def basePlaceholders = [
    divanStore: 'bazaar', divanApi: divanApi, divanLicenseKey: divanLicenseKey, divanMyketKey: '', divanBazaarKey: '', divanCertSha256: '', divanTapsell: divanTapsell,
    TapsellMediationAppKey: divanTapsell, marketApplicationId: 'ir.mservices.market',
    marketBindAddress: 'ir.mservices.market.InAppBillingService.BIND', marketPermission: 'ir.mservices.market.BILLING'
]

android {
    namespace 'com.meysam.divanemtiaz'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meysam.divanemtiaz'
        minSdk 21
        targetSdk 35
        versionCode 24
        versionName '5.5.1'
        manifestPlaceholders = basePlaceholders

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    signingConfigs {
        release {
            // A fixed key keeps every new APK installable over the previous one.
            // CI provides it from GitHub Secrets; without it the debug key is used.
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('DIVAN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('DIVAN_KEY_ALIAS')
                keyPassword System.getenv('DIVAN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8: removes unused code and resources and renames the rest, so the published APK is smaller and much
            // harder to read or patch (rules in proguard-rules.pro keep saved games and store billing intact).
            minifyEnabled true
            shrinkResources true
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [divanCertSha256: divanCertSha256]
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    // One build per store: each sells only through its own store's in-app billing.
    flavorDimensions 'store'
    productFlavors {
        bazaar {
            dimension 'store'
            manifestPlaceholders = basePlaceholders + [divanStore: 'bazaar', divanBazaarKey: divanBazaarKey]
        }
        myket {
            dimension 'store'
            manifestPlaceholders = basePlaceholders + [divanStore: 'myket', divanMyketKey: divanMyketKey]
        }
        // Downloaded from the site only (never uploaded to a store): pays through the web gateways of the panel.
        // A separate package, so it never replaces or updates a store install.
        direct {
            dimension 'store'
            applicationIdSuffix '.site'
            manifestPlaceholders = basePlaceholders + [divanStore: 'direct']
        }
    }

    // The Tapsell ad network is compiled in only when an app key is given; otherwise no ad SDK is in the APK at all.
    if (divanTapsell) {
        sourceSets.main.java.srcDirs += 'src/tapsell/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    bazaarImplementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'
    myketImplementation 'com.github.myketstore:myket-billing-client:1.19'
    if (divanTapsell) {
        implementation 'ir.tapsell.mediation:tapsell:1.3.0'
        implementation 'ir.tapsell.mediation.adapter:legacy:1.3.0'
    }
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// `testReleaseUnitTest` (the documented release check) runs the unit tests of every build.
afterEvaluate {
    if (tasks.findByName('testReleaseUnitTest') == null) {
        tasks.register('testReleaseUnitTest') { dependsOn 'testBazaarReleaseUnitTest', 'testMyketReleaseUnitTest', 'testDirectReleaseUnitTest' }
    }
}
